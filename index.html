<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://api.iconify.design/twemoji:graduation-cap.svg"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#f0f4ff" />

    <!-- Judul & Meta SEO -->
    <title>EduKids Game 🎓 - Kuis Edukasi Pintar Anak SD</title>
    <meta
      name="description"
      content="Mainkan kuis edukasi interaktif untuk anak SD Kelas 1-6. Bebas login, cepat, dan seru untuk latihan di rumah maupun tugas sekolah!"
    />

    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-[#f0f4ff] select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service Worker PWA -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("SW Registered!", reg))
            .catch((err) => console.log("SW Error:", err));
        });
      }
    </script>
  </body>
</html>
